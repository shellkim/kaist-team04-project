<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>효과 감소 시점 알림 — P0</title>
<style>
  :root { --ink:#222; --sub:#666; --line:#e3e3e3; --bg:#faf8f6; --accent:#b0577a; --soft:#f6e9ef; --warn:#a15c00; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; color:var(--ink); background:var(--bg); line-height:1.5; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 8px 0 4px; }
  h2 { font-size: 16px; margin: 0 0 10px; }
  .lead { color: var(--sub); font-size: 14px; margin: 0 0 16px; }
  section { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; }
  .sim { background: #fffbe8; border-color:#eadfa8; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  label { font-size:14px; }
  input, select, button { font: inherit; font-size:14px; }
  input, select { padding:6px 8px; border:1px solid #ccc; border-radius:8px; background:#fff; }
  button { padding:7px 12px; border-radius:8px; border:1px solid #ccc; background:#fff; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.small { padding:4px 8px; font-size:13px; }
  .muted { color:var(--sub); font-size:13px; }
  .msg { font-size:14px; margin-top:8px; min-height: 1em; }
  .msg.error { color:#b3261e; }
  .msg.info { color:var(--warn); }
  .msg.ok { color:#2e7d32; }
  .alert { border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:10px; padding:12px; margin-bottom:10px; }
  .alert.end { border-left-color:#999; }
  .alert p { margin:0 0 10px; }
  .disclaimer { color:var(--sub); font-size:12px; margin-top:10px; border-top:1px dashed var(--line); padding-top:8px; }
  .card { background:var(--soft); border-radius:10px; padding:12px; }
  .card strong { color:var(--accent); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px 4px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--sub); font-weight:normal; font-size:13px; }
  .badge { display:inline-block; font-size:12px; padding:1px 8px; border-radius:999px; background:#eee; }
  .badge.tracking { background:#e3f0ff; color:#1f4e8c; }
  .badge.felt_decline { background:var(--soft); color:var(--accent); }
  .badge.past_range { background:#eee; color:#555; }
  .badge.replaced { background:#f3f3f3; color:#999; }
  .empty { color:var(--sub); font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>효과 감소 시점 알림</h1>
  <p class="lead">보톡스·필러를 받은 날짜를 남기면, 효과가 줄어들기 시작하는 시점에 지금 어떻게 느껴지는지 물어볼게요. 다음 시술 시점은 내가 판단해요.</p>

  <section class="sim" aria-label="날짜 시뮬레이터">
    <h2>오늘 날짜 (시뮬레이터)</h2>
    <div class="row">
      <input type="date" id="todayInput">
      <button class="small" data-shift="-7">−1주</button>
      <button class="small" data-shift="7">+1주</button>
      <button class="small" data-shift="14">+2주</button>
      <button class="small" data-shift="28">+4주</button>
      <button class="small" id="resetToday">실제 오늘로</button>
    </div>
    <div class="muted" id="realTodayNote"></div>
  </section>

  <section aria-label="알림함">
    <h2>알림함</h2>
    <div id="decisionCard"></div>
    <div id="inbox"></div>
  </section>

  <section aria-label="시술 기록" id="formSection">
    <h2>시술 기록</h2>
    <div class="row">
      <label>시술 종류
        <select id="typeInput">
          <option value="">선택하세요</option>
          <option value="보톡스">보톡스</option>
          <option value="필러">필러 (히알루론산)</option>
          <option value="기타">기타</option>
        </select>
      </label>
      <label>시술 날짜 <input type="date" id="dateInput"></label>
      <button class="primary" id="saveBtn">저장</button>
    </div>
    <div class="msg" id="formMsg"></div>
  </section>

  <section aria-label="기록 목록">
    <h2>기록 목록</h2>
    <div id="records"></div>
  </section>
</main>

<script>
// ---- 지속 기간표 (spec §2.2). 단위: 주 ----
const TABLE = {
  '보톡스': { name: '보톡스', range: '3~4개월', first: 12, interval: 2, upper: 16 },
  '필러':   { name: '필러',   range: '6~12개월', first: 26, interval: 4, upper: 52 },
};
const STATUS_LABEL = { tracking: '추적 중', felt_decline: '감소 체감', past_range: '범위 지남', replaced: '새 시술로 대체' };
const DISCLAIMER = '일반적인 지속 기간을 바탕으로 한 안내이며 의학적 판단이 아니에요. 이상 증상이 있다면 시술받은 병원에 문의하세요.';
const KEY = 'effect_alert_records';
const TODAY_KEY = 'effect_alert_today';

// ---- 날짜 유틸: ISO 날짜(YYYY-MM-DD) ↔ 일 번호 ----
function toDay(iso) { const [y, m, d] = iso.split('-').map(Number); return Date.UTC(y, m - 1, d) / 86400000; }
function fromDay(n) { return new Date(n * 86400000).toISOString().slice(0, 10); }
function realToday() { const d = new Date(); return fromDay(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000); }
function weeksSince(startIso, todayIso) { return Math.floor((toDay(todayIso) - toDay(startIso)) / 7); }

// ---- 저장소 ----
function loadRecords() {
  try {
    const v = JSON.parse(localStorage.getItem(KEY) || '[]');
    return Array.isArray(v) ? v.filter(r => r && TABLE[r.treatment_name] && Array.isArray(r.check_responses)) : [];
  } catch { return []; }
}
function persist(next) {
  // 실패하면 false. 호출한 쪽에서 메모리 상태를 바꾸지 않는다.
  try { localStorage.setItem(KEY, JSON.stringify(next)); return true; }
  catch { return false; }
}
let records = loadRecords();
let today = localStorage.getItem(TODAY_KEY) || realToday();
let lastDecision = null; // 방금 "줄어든 것 같아요"를 누른 record_id

function setToday(iso) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(iso)) return;
  today = iso;
  try { localStorage.setItem(TODAY_KEY, iso); } catch {}
  lastDecision = null;
  render();
}

// ---- 일정 규칙 (spec §2.3) ----
// 열린 알림은 기록당 최대 하나. 알림은 저장하지 않고 매번 계산한다.
function eventFor(r) {
  const t = TABLE[r.treatment_name];
  if (!t || r.status !== 'tracking') return null;
  const start = toDay(r.treatment_date);
  const last = r.check_responses[r.check_responses.length - 1];
  const next = last ? toDay(last.date) + t.interval * 7 : start + t.first * 7;
  const td = toDay(today);
  if (td < next) return null;
  // 오늘 ≥ 다음 체크일. 상한(당일 포함)을 넘었으면 범위 지남 안내.
  const type = td - start > t.upper * 7 ? 'end' : 'check';
  return { type, record: r, weeks: weeksSince(r.treatment_date, today) };
}
function effectiveStatus(r) {
  const ev = eventFor(r);
  return ev && ev.type === 'end' ? 'past_range' : r.status;
}
// 같은 종류에 시술일이 더 늦은 기록이 있으면, 추적 중인 기록은 대체된다.
function applyReplacement(list) {
  return list.map(r => {
    if (r.status !== 'tracking') return r;
    const newer = list.some(o => o !== r && o.treatment_name === r.treatment_name && o.treatment_date > r.treatment_date);
    return newer ? { ...r, status: 'replaced' } : r;
  });
}

// ---- 문구 템플릿 (spec §2.1) ----
const tpl = {
  check: (t, n) => `${t.name} 받은 지 ${n}주째예요. 일반적으로 ${t.range} 사이에 효과가 줄어들기 시작해요. 지금 효과가 어떻게 느껴지나요?`,
  end: (t, n) => `${t.name} 받은 지 ${n}주째예요. 일반적인 지속 기간(${t.range})을 지났어요. 이 시술의 알림은 여기서 마칠게요.`,
  card: (t, r) => `${t.name} · ${r.treatment_date} 시술 · <strong>${r.felt_decline_week}주째에 효과 감소를 느꼈어요</strong> (일반 범위: ${t.range})`,
};

// ---- 액션 ----
function update(id, fn) {
  const next = records.map(r => r.record_id === id ? fn(r) : r);
  if (!persist(next)) { alert('저장하지 못했어요. 다시 시도해 주세요.'); return false; }
  records = next;
  return true;
}
function answer(id, ans) {
  const ok = update(id, r => {
    const resp = [...r.check_responses, { date: today, answer: ans }];
    if (ans === 'declined') {
      return { ...r, check_responses: resp, status: 'felt_decline', felt_decline_week: weeksSince(r.treatment_date, today) };
    }
    return { ...r, check_responses: resp };
  });
  if (ok) { lastDecision = ans === 'declined' ? id : null; render(); }
}
function acknowledgeEnd(id) {
  if (update(id, r => ({ ...r, status: 'past_range' }))) render();
}
function removeRecord(id) {
  if (!confirm('이 기록을 지울까요? 알림도 함께 사라져요.')) return;
  const next = records.filter(r => r.record_id !== id);
  if (!persist(next)) { alert('저장하지 못했어요. 다시 시도해 주세요.'); return; }
  records = next;
  if (lastDecision === id) lastDecision = null;
  render();
}
function newRecordId() {
  const stamp = realToday().replace(/-/g, '');
  let n = 1, id;
  do { id = `record_${stamp}_${String(n++).padStart(3, '0')}`; } while (records.some(r => r.record_id === id));
  return id;
}
function save() {
  const type = $('typeInput').value;
  const date = $('dateInput').value;
  const msg = (text, cls) => { const m = $('formMsg'); m.textContent = text; m.className = 'msg ' + (cls || ''); renderRetry(false); };
  if (!type) return msg('시술 종류를 골라주세요.', 'error');
  if (type === '기타') return msg('아직 지원하지 않아요. 지금은 보톡스와 필러(히알루론산)만 알림을 드려요.', 'info');
  if (!date) return msg('시술 날짜를 넣어주세요.', 'error');
  if (date > today) return msg('미래 날짜는 기록할 수 없어요.', 'error');
  if (records.some(r => r.treatment_name === type && r.treatment_date === date)) return msg('이미 기록된 시술이에요.', 'error');

  const rec = {
    record_id: newRecordId(),
    treatment_name: type,
    treatment_date: date,
    created_at: new Date().toISOString(),
    status: 'tracking',
    check_responses: [],
    felt_decline_week: null,
  };
  const next = applyReplacement([...records, rec]);
  if (!persist(next)) {
    // 입력값은 폼에 남긴다.
    const m = $('formMsg'); m.textContent = '저장하지 못했어요. 다시 시도해 주세요.'; m.className = 'msg error';
    renderRetry(true);
    return;
  }
  records = next;
  $('typeInput').value = ''; $('dateInput').value = '';
  msg('저장했어요.', 'ok');
  lastDecision = null;
  render();
}
function renderRetry(show) {
  let b = $('retryBtn');
  if (show && !b) {
    b = document.createElement('button'); b.id = 'retryBtn'; b.className = 'small'; b.textContent = '다시 시도';
    b.style.marginLeft = '8px'; b.onclick = save; $('formMsg').after(b);
  } else if (!show && b) b.remove();
}

// ---- 화면 ----
const $ = id => document.getElementById(id);
function el(tag, attrs = {}, html = '') {
  const e = document.createElement(tag);
  Object.entries(attrs).forEach(([k, v]) => k === 'onclick' ? (e.onclick = v) : e.setAttribute(k, v));
  if (html) e.innerHTML = html;
  return e;
}
function disclaimer() { return el('div', { class: 'disclaimer' }, DISCLAIMER); }

function renderDecision() {
  const box = $('decisionCard'); box.innerHTML = '';
  const r = records.find(x => x.record_id === lastDecision);
  if (!r) return;
  const wrap = el('div', { class: 'alert' });
  wrap.append(el('div', { class: 'card' }, tpl.card(TABLE[r.treatment_name], r)));
  const btn = el('button', { class: 'primary', style: 'margin-top:10px', onclick: () => { lastDecision = null; render(); $('formSection').scrollIntoView({ behavior: 'smooth' }); $('typeInput').focus(); } });
  btn.textContent = '새 시술 기록하기';
  wrap.append(btn, disclaimer());
  box.append(wrap);
}

function renderInbox() {
  const box = $('inbox'); box.innerHTML = '';
  const events = records.map(eventFor).filter(Boolean)
    .sort((a, b) => a.record.treatment_date.localeCompare(b.record.treatment_date));
  if (!events.length) {
    if (!lastDecision) box.append(el('div', { class: 'empty' }, '지금은 알림이 없어요.'));
    return;
  }
  events.forEach(ev => {
    const t = TABLE[ev.record.treatment_name], id = ev.record.record_id;
    const a = el('div', { class: 'alert' + (ev.type === 'end' ? ' end' : '') });
    a.append(el('p', {}, ev.type === 'check' ? tpl.check(t, ev.weeks) : tpl.end(t, ev.weeks)));
    const row = el('div', { class: 'row' });
    const btns = ev.type === 'check'
      ? [['아직 남아 있어요', () => answer(id, 'remaining')], ['줄어든 것 같아요', () => answer(id, 'declined')], ['잘 모르겠어요', () => answer(id, 'unsure')]]
      : [['확인했어요', () => acknowledgeEnd(id)]];
    btns.forEach(([label, fn]) => { const b = el('button', { onclick: fn }); b.textContent = label; row.append(b); });
    a.append(row, disclaimer());
    box.append(a);
  });
}

function renderRecords() {
  const box = $('records'); box.innerHTML = '';
  if (!records.length) { box.append(el('div', { class: 'empty' }, '아직 기록한 시술이 없어요.')); return; }
  const table = el('table');
  table.innerHTML = '<thead><tr><th>시술</th><th>시술일</th><th>경과</th><th>상태</th><th></th></tr></thead>';
  const tbody = el('tbody');
  [...records].sort((a, b) => b.treatment_date.localeCompare(a.treatment_date)).forEach(r => {
    const t = TABLE[r.treatment_name];
    const st = effectiveStatus(r);
    const w = weeksSince(r.treatment_date, today);
    const tr = el('tr');
    tr.append(
      el('td', {}, t.name),
      el('td', {}, r.treatment_date),
      el('td', {}, w >= 0 ? `${w}주째` : '—'),
      el('td', {}, `<span class="badge ${st}">${STATUS_LABEL[st]}</span>` +
        (st === 'felt_decline' ? `<div class="muted">${r.felt_decline_week}주째에 감소를 느꼈어요</div>` : '')),
    );
    const td = el('td'); const b = el('button', { class: 'small', onclick: () => removeRecord(r.record_id) }); b.textContent = '삭제';
    td.append(b); tr.append(td); tbody.append(tr);
  });
  table.append(tbody);
  box.append(table);
}

function render() {
  $('todayInput').value = today;
  $('dateInput').max = today;
  const real = realToday();
  $('realTodayNote').textContent = today === real ? `실제 오늘(${real})과 같아요.` : `실제 오늘은 ${real}이에요. 지금은 ${today} 기준으로 보고 있어요.`;
  renderDecision();
  renderInbox();
  renderRecords();
}

$('todayInput').addEventListener('change', e => setToday(e.target.value));
document.querySelectorAll('[data-shift]').forEach(b => b.addEventListener('click', () => setToday(fromDay(toDay(today) + Number(b.dataset.shift)))));
$('resetToday').addEventListener('click', () => setToday(realToday()));
$('saveBtn').addEventListener('click', save);
render();
</script>
</body>
</html>
